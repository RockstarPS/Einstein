# Disable IP forwarding (prevents acting as a router)
net.ipv4.ip_forward = 0

# Reverse path filtering (anti-spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Block ICMP redirect packets (prevent malicious rerouting)
net.ipv4.conf.all.accept_redirects = 0

# Block source-routed packets (prevent route spoofing)
net.ipv4.conf.all.accept_source_route = 0

# Enable SYN cookies (protect against SYN flood attacks)
net.ipv4.tcp_syncookies = 1

# Increase TCP SYN backlog to better handle connection spikes
net.ipv4.tcp_max_syn_backlog = 4096
