#include conf.d/*.conf
#Create a new configuration file: vim /etc/swanctl/swanctl.conf

connections {
#IPSEC name
        mic-initiator {
                #IKE version, 1 means IKEv1, 2 meansIKEv2
                version = 2
                #make_before_break=yes
                #Local IPSEC address
                local_addrs = 160.48.199.95
                #IPSECphase one encryption set
                #Suite#1
                        #Encryption: AES with 256-bit keys in CBC mode [RFC 3602]
                        #Integrity: HMAC-SHA-384-192 [RFC 4868]
                        #Pseudo-random function: PRF-SHA-384 [RFC 4868]
                        #Diffie-Hellman group: 384-bit random ECP group [RFC 5903]
                #Suite#2
                        # Encryption: AES with 128-bit keys in CBC mode [RFC 3602] ; -
                        # Integrity: HMAC-SHA-256-128 [RFC 4868] ; -
                        # Pseudo-random function: PRF-SHA-256 [RFC 4868] ; -
                        # Diffie-Hellman group: 256-bit random ECP group [RFC 5903]
        proposals=aes256-aes128-sha384-sha256-prfsha384-prfsha256-ecp384-ecp256
                #no MOBIKE protocol
                mobike = no
                # dpd Dead Peer Detection interval
                dpd_delay = 6s
                #DPD Dead Peer detection timeout
                dpd_timeout = 20s
                #DPD Dead Peer detection action
                # re-key time
                rekey_time = 24h 

                keyingtries = 3
                
                fragmentation = yes

                        #Localauthentication
                        local{
                                #Authentication method: ike-public key
                                auth = pubkey
                                id = "C=CH, O=strongswan, CN=device1.strongswan.org"
                        }

                        # Peerauthentication
                        remote{
                                auth = pubkey
                        }

                        #IPSEC phase two setting
                        #Only-secure traffic:

            #32491/* - 32499/* - SOME/IP only-secure client ports - traffic shall be only accepted, if protected by IPsec.

            #32501/* - 32599/* - SOME/IP only-secure server ports - traffic shall be only accepted, if protected by IPsec.

            #32898/* - 32998/* - SOME/IP only-secure client ports extended - traffic shall be only accepted, if protected by IPsec.
                        children {
                        #Phase 2 name,
                                mic-secure-esp-traffic  {
                                        #Phase 2 encryption aggregation
                                        #ESP algorithm:
                                                #1 AES-GCM with a 16 octet ICV [RFC 4106]
                                                #2 ENCR_AES_CCM_16 [RFC 4309]
                                        esp_proposals = aes256gcm16-aes256ccm16
                                        #Local flow of interest
                                        #The peer is interested in the flow
                                        local_ts = dynamic[tcp/32491-32499],dynamic[tcp/32501-32599],dynamic[tcp/32898-32998]
                                        remote_ts = dynamic[tcp/32491-32499],dynamic[tcp/32501-32599],dynamic[tcp/32898-32998]
                                        #IPSEC transport mode
                                        mode =transport
                                        # When dpd detection fails, IKE negotiation will be reinitiated immediately gotiation will be reinitiated immediately
                                        dpd_action = restart
                                        #The actioon performed when loading the configuration
                                        start_action = start
                                        #life time
                                        life_time = 24h
                                }
                                mic-secure-ah-traffic  {
                                        #Phase 2 encryption aggregation
                                        # algorithms for AH:
                                        #1 HMAC-SHA-512-256: AES Keyed-Hash Message Authentication Code (HMAC)
                                        #2 AUTH_AES_CMAC_96: AES Cipher-based Message Authentication Code (CMAC) ;
                                        ah_proposals = sha512-aescmac

                                        #Local flow of interest
                                        #The peer is interested in the flow
                                        local_ts = dynamic[tcp/32491-32499],dynamic[tcp/32501-32599],dynamic[tcp/32898-32998]
                                        remote_ts = dynamic[tcp/32491-32499],dynamic[tcp/32501-32599],dynamic[tcp/32898-32998]
                                        #IPSEC transport mode
                                        mode =transport
                                        # When dpd detection fails, IKE negotiation will be reinitiated immediately gotiation will be reinitiated immediately
                                        dpd_action = restart
                                        #The actioon performed when loading the configuration
                                        start_action = start
                                        #life time
                                        life_time = 24h
                                }

                                #non-secure traffic:

                                #34491/* - 34499/* - SOME/IP never-secure client ports - traffic shall not be protected by IPsec.

                                #34501/* - 34599/* - SOME/IP never-secure server ports - traffic shall not be protected by IPsec.

                                #34898/* - 34998/* - SOME/IP never-secure client ports - traffic shall not be protected by IPsec.
                                mic_neversecure_traffic  {
                                        #Local flow of interest
                                        local_ts = dynamic[tcp/32500],dynamic[tcp/32600-32605],dynamic[tcp/32608-32639],dynamic[tcp/32700-32705],dynamic[tcp/32896-32897],dynamic[tcp/32999],dynamic[tcp/33000-33004],dynamic[tcp/34491-34499],dynamic[tcp/34501-34599],dynamic[tcp/34898-34998]

                                        #The peer is interested in the flow
                                        remote_ts = dynamic[tcp/32500],dynamic[tcp/32600-32605],dynamic[tcp/32608-32639],dynamic[tcp/32700-32705],dynamic[tcp/32896-32897],dynamic[tcp/32999],dynamic[tcp/33000-33004],dynamic[tcp/34491-34499],dynamic[tcp/34501-34599],dynamic[tcp/34898-34998]
                                        #IPSEC transport mode
                                        mode =pass
                                        # When dpd detection fails, IKE negotiation will be reinitiated immediately
                                        dpd_action = restart
                                        #The action performed when loading the configuration
                                        start_action = trap
                                        #life time
                                        life_time = 24h
                                }
                        }
                }
        }
#Secretkeysettings
        secrets {
        token-slot0 {
                handle = 03
                slot = 0
                pin = 1234
                module = optee
        }
}