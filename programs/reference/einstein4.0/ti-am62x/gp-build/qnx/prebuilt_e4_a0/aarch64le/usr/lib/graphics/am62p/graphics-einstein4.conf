begin khronos

  begin egl display 1
    egl-dlls = libsrv_um.so libglslcompiler.so libIMGegl.so
    #glesv1-dlls = libsrv_um.so libglslcompiler.so libIMGegl.so libIMGGLESv1_CM.so
    glesv2-dlls = libsrv_um.so libglslcompiler.so libIMGegl.so libIMGGLESv2.so
    cl-dlls = libsrv_um.so libufwriter.so libPVROCL.so
    vk-icds = libsrv_um.so libufwriter.so rgx_vulkan_icd.json
    vk-exps = /app/usr/lib/graphics/vulkan/VkLayer_khronos_validation.json
    gpu-dlls = libsrv_km.so
  end egl display

  begin wfd device 1
    wfd-dlls = libwfdcfg-einstein.so libWFDam62p.so

    # port/vp binding
    # Note: in the case of a single port requiring multiple VP specify primary VP first
    # 1 = VP1
    # 2 = VP2
    port1=1

    # Pipeline/display binding
    video1 = 1
    videolite1 = 1

  end wfd device

end khronos

begin winmgr

  begin globals
    blit-config = gles2blt
    alloc-config = jacinto7-alloc
  end globals

  begin display 1
    formats = rgba8888, rgbx8888, rgb565, rgba5551, yuy2, uyvy, nv12
    video-mode = 1920 x 720 @ 60
    cursor = off
  end display

  begin class framebuffer-1
    display = 1
    pipeline = 1
    format = rgba8888
    usage = gles2blt
  end class

end winmgr
