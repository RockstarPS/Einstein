/*
** Define the number of entities needed by your code.  An entity is an entry
** in the "GALLO_Stack" array of type "GALLO_StackType".  It is used to hold
** information related to RAM that has been allocated in the graphics RAM
** for text and other RAM based graphical data.  This must be set to at least
** 16 because the GDG02_GFX_MGR.C uses 0 - 15 for its own purposes.
*/
#define     GALLO_ENTITIES     (20u)



