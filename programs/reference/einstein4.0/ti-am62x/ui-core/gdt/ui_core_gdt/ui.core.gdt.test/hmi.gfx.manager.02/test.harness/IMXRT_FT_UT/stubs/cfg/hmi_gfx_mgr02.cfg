/*
** Configure information about the GRAM location and size
** Set the GRAM size in bytes in GFX_MGR_GRAM_SIZE
** Set the GRAM base address in  GFX_MGR_GRAM_BASE
** Following shows example configuration for few of the
** devices assuming GRAM is fully utilized by hmi_gfx_manager
** If the GRAM is shared with others(e.g OpenVG), these definitions
** can be modified to specify the exact GRAM available for GFX_MGR02.
** Note : GFX_MGR02_GRAM_BASE should not be set for a WIN32 or
**        MATLAB build because it will be taken care internally.
*/
#if defined (CWR_MPC5645S)
   #define GFX_MGR02_GRAM_SIZE      ((UINT32)(0x100000u))
#elif defined (CWR_MPC5645S_LITE)
   #define GFX_MGR02_GRAM_SIZE      ((UINT32)(0x80000u))
#else
   #define GFX_MGR02_GRAM_SIZE      ((UINT32)(0x28000u))
#endif

#if !defined(WIN32) && !defined(MATLAB_MEX_FILE)
  #define GFX_MGR02_GRAM_BASE       ((UINT32)(0x60000000u))
#endif

/*
** Specify overlap error allowed when determining an element is hidden
** below another one. Below configurations allow a layer to be set as hidden
** eventhough GFX_MGR_ALLOWED_OVERLAP_ERROR_W pixels AND/OR GFX_MGR_ALLOWED_OVERLAP_ERROR_H
** pixels are still visible.
*/
#define GFX_MGR02_ALLOWED_OVERLAP_ERROR_W     (2)
#define GFX_MGR02_ALLOWED_OVERLAP_ERROR_H     (2)

/*
** Below configuration controls how the layer allocation needs to be
** managed. You can choose from the following configurations
** 1. LOW2HIGH
**      Layer allocation is done from low priority to high
**      priority. Allocation stops when all available layers are
**      exhausted. There is a possibility that high priority
**      screens may not be allocated layers
** 2. LOW2HIGH_RESERVE_FOR_HP_SCREEN
**      Highest active priority screen is always allocated with layers
**      Remaining layers are allocated from low priority to high
**      priority.
** 3. HIGH2LOW
**      Layer allocation is done from high priority to low
**      priority. Allocation stops when all available layers are
**      exhausted. There is a possibility that low priority
**      screens may not be allocated layers
*/
#define GFX_MGR02_LAYER_ALLOCATION_MODE     (LOW2HIGH_RESERVE_FOR_HP_SCREEN)

/*
** Specify the DMA channel to be used by the Graphics Manager for its
** building operations.
*/
#define GFX_MGR02_DMA_CHANNEL               (0)

/*
** If you are using the Sharp LQ042 display connected to the DCU, you
** can #define the "GFX_MGR02_USE_SHARP_LQ042" macro and a display setup
** function called "hmi_gfx_mgr02_driver_SetupLQ042()" will be conditionally compiled
** in and executed when appropriate.
**
** If you #define the "GFX_MGR02_USE_SHARP_LQ042" macro, a subset of
** the display timing parameters can be adjusted by configuring
** the macros shown below.  These parameters are described in detail
** in the comments in "hmi_gfx_mgr02_driver_SetupLQ042()".
** The key to configuring the timing is to ensure that the frames
** per second (FPS) update rate of the display is fast enough to meet
** your customer requirements and stays within the tolerance of the
** display itself.
**
** If you are not using that display(s) or would like different
** timing parameters, comment out "GFX_MGR02_USE_SHARP_LQ042" and
** define "GFX_MGR02_PROD_SPEC_DISPLAY_SETUP()" as a function to setup
** whatever display(s) you are using and use "hmi_gfx_mgr02_driver_SetupLQ042()"
** as an example of what you need to do.
*/
/*
**  The below configuration is to select the Sharp LQ042 display or another display.
**  If Sharp LQ042 display is selected, then define the GFX_MGR02_USE_SHARP_LQ042
**  otherwise comment this and add a function to initialise the TFT LCD display.
**  Recommended configuration for a Sharp LQ042 being driven by a DCU
**  with a 64MHz PLL clock:
*/
#if defined(WIN32)
#define GFX_MGR02_USE_SHARP_LQ042
#define SHARP_LQ042_BACK_PORCH_HORIZONTAL  112
#define SHARP_LQ042_PULSE_WIDTH_HORIZONTAL 5
#define SHARP_LQ042_FRONT_PORCH_HORIZONTAL 2
#define SHARP_LQ042_BACK_PORCH_VERTICAL    29
#define SHARP_LQ042_PULSE_WIDTH_VERTICAL   2
#define SHARP_LQ042_FRONT_PORCH_VERTICAL   2
#define SHARP_LQ042_DIV_RATIO              0x0B
#define GFX_MGR02_PROD_SPEC_DISPLAY_SETUP()
#else
#define GFX_MGR02_PROD_SPEC_DISPLAY_SETUP() hmi_gfx_driver_setup()
#endif

