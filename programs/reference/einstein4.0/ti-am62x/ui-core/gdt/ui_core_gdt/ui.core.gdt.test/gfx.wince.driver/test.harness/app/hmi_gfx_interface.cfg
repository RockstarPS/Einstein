** Set the queue size in bytes. Set this to a value of 2 power N.
** Operation is not guarenteed otherwise.
*/
#define HMI_GFX_IF_QUEUE_SIZE        (0x1000)

/*
** Control whether the command support is required or not by setting to 0/1.
*/
#define HMI_GFX_IF_NEED_FADE_CMD     (0)
#define HMI_GFX_IF_NEED_VIDEO_IN_CMD (0)

/*
** If the compiler doesnot have wide char support enable the software
** L conversion
*/
