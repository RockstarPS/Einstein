/*
** Enable performance log capturing for gfx02 by defining GFX_MGR02_ENABLE_LOG
** Commentout GFX_MGR02_ENABLE_LOG if not required.
** If enabled, define the additional macros
** GFX_TCOUNT      - to a function or timer counter register to read the current 
**                   free running tick count.
** GFX_TCOUNT_TYPE - data type of the tick counter UINT16 or UINT32 for example
** GFX_TCOUNT_HZ   - Frequency in Hz at which the tick counter increments
** Following example configuration enables it for a windows build
*/
#ifdef WIN32
 #ifdef HMI_GFX_MGR02_PERFLOG_C
   //for high performance timer
   __int64 winGetPerformCounter(void)
   {
      LARGE_INTEGER lPerformanceCount = {0};
      QueryPerformanceCounter(&lPerformanceCount);
      return(lPerformanceCount.QuadPart);
   }
           
   __int64 winGetPerformFreq(void)
   {
      LARGE_INTEGER lFrequency = {0};
      QueryPerformanceFrequency(&lFrequency);
      return(lFrequency.QuadPart);
   }
 #endif

 #define GFX_MGR02_ENABLE_LOG
 #define GFX_TCOUNT            winGetPerformCounter()
 #define GFX_TCOUNT_TYPE       __int64
 #define GFX_TCOUNT_HZ         winGetPerformFreq()

#else /* #ifdef WIN32 */
  /*
  ** For target specific performance capture, configure it here
  ** For Kepler Spectrum/Rainbow
  ** #define GFX_TCOUNT      (STM.CNT.R)
  ** #define GFX_TCOUNT_TYPE (UINT32)
  ** #define GFX_TCOUNT_HZ   (1000000)
  */
 //#define GFX_MGR02_ENABLE_LOG 
 #define GFX_TCOUNT           FRT02.unTCDT.u32Register
 #define GFX_TCOUNT_TYPE      UINT32
 #define GFX_TCOUNT_HZ        (60*1000000)
#endif /* #ifdef WIN32 */

