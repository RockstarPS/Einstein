/* ---------------- DCU/2d-ACE QSPI CHECKSUM CALCULATION ---------------------
** GFX_MGR02_CALC_QSPI_CHKSUM - 
** GFX_MGR02_PERFORM_QSPI_CHECKSUM() - 
** The QSPI devices are normally dedicated to DCU and the DCU will be displaying
** content out of the QSPI memory during active frame period. The only time the 
** DCU will not be accessing it will be during the horizontal and vertical 
** blanking period of the TFT. The checksum calculation of QSPI memory needs the
** CPU to access it. But allowing it during the DCU is performing the access might
** result in bandwidth reduction and DCU getting starved of data and utimately
** the display losing sync momentarily.
** Graphics manager provides a callback from the vsync ISR where in the QSPI
** checksum component can safely access the QSPI memory. This can be enabled by 
** defining GFX_MGR02_CALC_QSPI_CHKSUM and then configuring an appropriate 
** call back function to GFX_MGR02_PERFORM_QSPI_CHECKSUM(). Its needs to be
** noted that the callback is called from an ISR and the checksum calculator 
** needs process only as many bytes to meet the execution time targets for an
** ISR stipulated by DI-Architecture.
** Note :- Since checksum calculation is done as an error detection mechanism
** and reporting during ETM or diagnostics and if the customer is OK to compromize
** the display behaviour during the checksum calculation, we could still keep
** this commnted out and do the checksum calculation normally.
** 
** In cases where the DCU displayes contents only from GRAM or DDR and nor from
** QSPI memory, these definitions can be kept commented out. In these cases
** QSPI can be accesses freely by the checksum component.
** --------------------------------------------------------------------------*/
/* #define GFX_MGR02_CALC_QSPI_CHKSUM */
/* #define GFX_MGR02_PERFORM_QSPI_CHECKSUM()  */

/* ---------------- DCU/2D-ACE CLUT LOAD OPTIONS ------------------------------
** GFX_MGR02_DYNAMIC_CLUT_LOAD_SUPPORT_NEEDED - 
** As you know the DCU has only limited CLUT RAM (8Kbytes for Rainbow). This can
** hold 2048 color entries. Your graphics design can result in two situations
** Situation1 :- The number of CLUT entries is <= 2048colors
** Situation2 :- The number of CLUT entries is  > 2048colors
** In situation 1, we can load all of the CLUT entries in to CLUT RAM during
** the startup and there after the graphics manager need not worry about 
** programming the CLUT table at all. This will be most efficient way since
** we don't need to spend valuable CPU time in Vsync ISR to program the CLUT
** RAM.
** But complex applications always result in a CLUT entries > 2048 and in this
** case we cannot load all of the CLUT entries in to CLUT RAM during startup.
** In order to support these two cases, graphics manager supports two ways 
** of CLUT loading. GFX_MGR02_DYNAMIC_CLUT_LOAD_SUPPORT_NEEDED determines
** which method should be applied.
** For situation 1: - You can keep this macro commented out so that Gfx manager
**                    loads all the CLUT in to CLUT RAM during startup. 
**                    Uncommenting the macro also will work fine for this 
**                    situation but is not recomended.
** For situation 2: - Uncomment or define this macro. This will make the graphics
**                    manager to dynamically load the CLUT tables for the images
**                    that are on the display/TFT at a given instance.
**                    Commenting out this macro in this situation will make
**                    images to appear incorrectly who's CLUT are > 2048 mark
** --------------------------------------------------------------------------*/
/*#define GFX_MGR02_DYNAMIC_CLUT_LOAD_SUPPORT_NEEDED*/


