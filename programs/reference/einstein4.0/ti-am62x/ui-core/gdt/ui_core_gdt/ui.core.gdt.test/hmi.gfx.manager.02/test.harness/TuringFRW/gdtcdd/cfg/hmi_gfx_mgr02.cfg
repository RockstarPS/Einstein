/* ---------------- OVG Library GRAPHICS CONFIGURATIONS -----------------------
** GFX_MGR02_VG_CACHE_SIZE - 
**    For openVg rendering each object has to be first created and then drawn.
**    In most applications we will be operating with limited memory and therefore
**    we cannot keep the created objects for long and therefore will be forced 
**    to delete the objects 
**      1. As soon as it is drawn
**      2. As soon as it is no longer required
**    First option brings some performance issue for cases where a same object has
**    to be drawn repeatedly. 
**    Graphics manager implements a mechanism to cache the most used objects. 
**    Objects are created and put in to a pool and allow it to stay in the pool until
**    the pool has space. When the pool becomes full then least used items from the
**    pool is deleted. The GFX_MGR02_VG_CACHE_SIZE defines how many entries has to be
**    there in the pool. Larger the cache size the larger the memory that will be 
**    required. Configure it to zero if no pool is required and with 0, an object
**    will be deleted as soon as the draw is finished.
** GFX_MGR02_VG_RENDER_QUALITY - 
**    Choose the rendering(VG_RENDERING_QUALITY)/image quality(VG_IMAGE_QUALITY)
**    to be set
**    0 - QUALITY_NONANTIALIASED
**    1 - QUALITY_FASTER        
**    2 - QUALITY_BETTER        
** GFX_MGR02_PRECREATE_FONTS - 
**    Generally the font glyphs are created, drawn and distroyed by graphics
**    manager. But this will result in a performance hit because creation and
**    distroy will be time consuming. So this configuration is to override the 
**    default configuration and allow the graphics manager to create all the 
**    glyphs during start up itself. This will improve the speed o maximum 
**    extend but the draw back is that more memory requirement and startup time
**    The otehr way is to cache a limited set of glyphs but it is not 
**    implemented currently. valid options are
**    FONTS_NONE              - No pre creation
**    FONTS_BITMAP            - precreate only bitmap fonts (not supported)
**    FONTS_SVG               - precreate only vector fonts
**    FONTS_BITMAP|FONTS_SVG  - precreate both vector and bitmap fonts
** GFX_MGR02_OVG_BUFFER_W_ALIGN_BYTES - 
**    Define the alignment reqired in byted for OpenVG framebuffers. Currently
**    this is used only for dynamic buffer allocation in Kepler DCU and is 
**    also defaulted to 8bytes or 32bits. So configure this only if a change
**    is required.
**
** GFX_MGR02_ENABLE_FSL_EXTENTIONS & FSL_CONST_IMAGES - 
**    GFX_MGR02_ENABLE_FSL_EXTENTIONS - Enable for freescale Rainbow platform (MPC5645S). 
**    Additionally enable FSL_CONST_IMAGES to allow VG to load images directly
**    from flash without creating in video RAM.
**
** GFX_MGR02_RENESAS_OPENVG_LIB - Enable this if the target is Renesas SH7269
**
** GFX_MGR02_ENABLE_HW_DITHERING - Enable this to support hardware dithering
** GFX_MGR02_VG_MIRROR_OUTPUT    - enable mirroring of the output. Without this
**                                 openvg layers will look upside down due to 
**                                 the origin difference between gdt and openvg
** --------------------------------------------------------------------------*/
#define GFX_MGR02_VG_CACHE_SIZE            (10)
#define GFX_MGR02_VG_RENDER_QUALITY        (1)
#define GFX_MGR02_PRECREATE_FONTS          (FONTS_NONE)
#define GFX_MGR02_VG_MIRROR_OUTPUT
/*#define GFX_MGR02_OVG_BUFFER_W_ALIGN_BYTES (32)*/
/*#define GFX_MGR02_ENABLE_FSL_EXTENTIONS*/
/*#define FSL_CONST_IMAGES*/
/*#define GFX_MGR02_RENESAS_OPENVG_LIB*/

