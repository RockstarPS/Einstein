/* ---------------- DCU/2D-ACE RENDERING CONTROL -----------------------------
** GFX_MGR02_SYNCHRONISE_DMA_BUILD_WITH_VBLANK :- 
** Define this macro to synchronize the eDMA based build routines to bigin its
** operations during the vblank period. This will be useful if the eDMA needs to
** access the same memory where the DCU also might be accessing. In this case
** if the memory doesnot have enough bandwidth to honor the DCU requests there
** are chances that DCU might loose its sync and display content getting 
** scrambled. By enabling this option the eDMA opration starts during the start 
** vblank where the DCU may not be accessing any content. But enabling this
** will reduce the maximum fps to 2 cycle times (if TFT is 60fps, the display
** content refresh rate will be only 30fps maximum)
** If the eDMA access memory is having enough bandwidth to support dual
** access by eDMA and DCU or the memory is exclusively owned by eDMA then 
** this option can be commented out. This way the display content build will be
** started as soon as possible with out waiting for the vblank period and 
** we could achive a maximum display content refresh rate equel to the TFT rate
**
** GFX_MGR02_BG_DMA_SEQ_RENDERING :-
** When there are backround built contents such as OpenVG widgets or 
** multicolor widgets, there is two options to schedule these building
** SEQUENTIAL - i.e All eDMA based rendering is completed and then 
**              background built layers are rendered. This ensures lesser
**              memory bandwidth but slightly more rendering time
**              Set GFX_MGR02_BG_DMA_SEQ_RENDERING to 1
** PARALLEL  - i.e. The background content building is triggered and happens
**             in paralle with eDMA rendering. More bandwith usage bu completes
**             frame building quciker.  
**              Set GFX_MGR02_BG_DMA_SEQ_RENDERING to 0
**
** GFX_MGR02_GRAM_OVERAP_HANDLING :-
** When the GRAM allocation happens for the next updates, there may be a chance 
** that the next updates requires more GRAM and may overlap with the currently
** active/disdplayed contents's GRAM. And no double buffer possible for items
** which overlaps with active layer contents. So if we perform a background 
** update on those overlapped contents it might end up showing some unnecessary
** artifats or a corrupted display momentarily. To handle the situation we have 
** few choices
** 1. GFX_MGR02_GRAM_OVERAP_HANDLING = GFX_MGR02_BUILD_DCU_NORMAL 
**    case (a) If GFX_MGR02_SYNCHRONISE_DMA_BUILD_WITH_VBLANK = 0 then the 
**             building happens in background and may be while the overlapped
**             contents are on display
**    case (b) If GFX_MGR02_SYNCHRONISE_DMA_BUILD_WITH_VBLANK = 1 then the 
**             building starts during the blanking period and by the time we 
**             reach building the overlapped content, if we are still within
**             the blanking time then we are safe. But by chance if the non
**             overlapped contents building pushed outside the blanking period
**             then we might end up seeing some unwanted effects on the display
** 2. GFX_MGR02_GRAM_OVERAP_HANDLING = GFX_MGR02_BUILD_IN_VBLANK then, all the 
**    layers with non-overlapped GRAM is built in the background and the layers
**    with overlapped contents are only taken up in the next vblank period. So
**    this gives the maximum benefit to complete the operation within the 
**    blanking period for the overlapped contents. This requires an additional
**    vsync period than the regular building to finish the buildiing. But the
**    catch here is that, if the overlapped content is a multi-color widget 
**    which requires post-processing (to convert to multicolor), then the 
**    post-processing is done in the background and there is a chance that it 
**    might affect the display. But otherwise this will give us the maximum benefit.
** 3. GFX_MGR02_GRAM_OVERAP_HANDLING = GFX_MGR02_BUILD_DCU_OFSCRN then, 
**    a special build scheme is used. All the DCU layer contents except
**    fill layers are built inside GFX_MGR02_GRAM_BASE area. The full
**    GFX_MGR02_GRAM_BASE area is available for usage. Now once the building
**    completes the entire GFX_MGR02_GRAM_BASE area is copied to GFX_MGR02_GRAM_DCU_BASE
**    area during vblank period and the DCU is then programmed with references
**    to GFX_MGR02_GRAM_DCU_BASE. The only usecase for this is with rainbow
**    target with a DDR. GFX_MGR02_GRAM_BASE will be a 1MB area within DDR and
**    GFX_MGR02_GRAM_DCU_BASE will be 1MB area of the internal GRAM. So all the
**    building happens in DDR and then copied to GRAM and displayed. This will
**    give some relif to the bandwidth issues w.r.t usage of DDR with DCU
**    With this option enable the GFX_MGR02_USE_OPTIMAL_EDMA_SIZE to make the
**    DDR to GRAM copy faster.
**
** GFX_MGR02_EDMA_BWC :- bandwidth control configuration to be used with
** eDMA. Refer eDMA section of the micro reference manual. The BWC can be 
** elivated if you are facing issues w.r.t bandwidth (e.g no problem while
** execution is breaked, but if the program is allowed to run we see flickers)
** Valid range 0 to 3. 
** Set both BWC to 0 when GFX_MGR02_GRAM_OVERAP_HANDLING = GFX_MGR02_BUILD_DCU_OFSCRN
** GFX_MGR02_EDMA_BWC_BG_RENDERING     - BWC setting for the background
**                                       rendering operations such as clearing
**                                       of buffers.
** GFX_MGR02_EDMA_BWC_NORMAL_RENDERING - BWC setting for the normal
**                                       rendering operations which are 
**                                       happening during the vsync period
** GFX_MGR02_WDG_ALPHA_CONTROL - Enable if alpha control for texts inside a 
**                               widget is required.
** --------------------------------------------------------------------------*/
#define GFX_MGR02_SYNCHRONISE_DMA_BUILD_WITH_VBLANK
#define GFX_MGR02_BG_DMA_SEQ_RENDERING             0
#define GFX_MGR02_GRAM_OVERAP_HANDLING             (GFX_MGR02_BUILD_IN_VBLANK)
#define GFX_MGR02_EDMA_BWC_NORMAL_RENDERING        0
#define GFX_MGR02_EDMA_BWC_BG_RENDERING            3
/*#define GFX_MGR02_WDG_ALPHA_CONTROL */
/*#define GFX_MGR02_USE_OPTIMAL_EDMA_SIZE*/

