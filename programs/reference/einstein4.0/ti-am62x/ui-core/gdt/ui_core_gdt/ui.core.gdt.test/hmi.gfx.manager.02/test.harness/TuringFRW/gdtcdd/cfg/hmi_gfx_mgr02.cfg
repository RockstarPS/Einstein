/* ----------------------- DIRTY AREA REDRAW CONFIGURATIONS -------------------
** OpenVG and Software rendering can additional capability to determine
** dirty areas which require updates and update only those dirty regions
** rather than building the whole content again to reduce build time
** This is not available for DCU.
** GFX_MGR02_DIRTY_REGION_REDRAW - defining this will enable dirty area
**                                 redraw. Uses additional RAM to store the 
**                                 elements previous status and next status etc
**                                 for calculations
** GFX_MGR02_DAR_RECT_PROXIMITY  - proximity value for rectangles if a rectangle
**                                 comes closer with in this proximity value, they 
**                                 get comined as a single dirty rectangle.
**                                 This option is to reduce the number of dirty
**                                 rectangles. valid ranges are from 0 to XX
**                                 value of 0 means no proximity for dirty
**                                 rectanges and multiple dirty rectangles gets
**                                 combined only if they actually overlap
** GFX_MGR02_DAR_MAX_RECTANGLES  - Threshold value to stop the dirty area 
**                                 redraw and do a full update instead. Because
**                                 dirty area update on a large number of 
**                                 rectangles may be slower than doing a full 
**                                 update. Valid values are from 0 - XX
**                                 Value 0 means option is disabled and dirty
**                                 area update is performed regardless of number
**                                 dirty rectangles.
** --------------------------------------------------------------------------*/
