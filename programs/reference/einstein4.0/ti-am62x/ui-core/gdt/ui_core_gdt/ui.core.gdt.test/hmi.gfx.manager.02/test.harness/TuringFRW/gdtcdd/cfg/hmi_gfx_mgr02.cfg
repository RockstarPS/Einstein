/* ----------------------- COMMON CONFIGURATIONS ---------------------------
** GFX_MGR02_DEFAULT_BACKGROUND_COLOR - 
**    Define the 32-bit default background color.  Any area of the display that
**    does not have an active pixel will be set to this color, and it will be
**    blended with other layers if those layers have selected the alpha
**    blending option.  This is the value that will be set at cold/warm/wakeup
**    initialization.
**
**    The MS 8-bits are ignored, the next 8-bits are the R value, then the G
**    value, then the B value.
**
**    Some examples:
**      0x00000000 black
**      0x00FFFFFF white
**      0x00404040 mid-gray
**      0x00FF7FFF pink
**
**    The macro "GFX_MGR02_DEFAULT_BACKGROUND_COLOR" selects the background
**    color for the DCU. 
**    This will be used for clearing of the buffer in the case of SWR/OVG 
**    layers (Not yet implemented)
** GFX_MGR02_DEFAULT_CHAR - 
**    When the text rendering routine doesnot finds a character code in the
**    font data table, then it will print this default character instead of
**    missing character in the string. Configure it to '*' if you want to
**    replace '*' where ever a character is missing or to any code as you wish.
**    Incase you don't any replacement character functionality for missing 
**    character, then configure it to 0x00
** GFX_MGR02_ARABIC_LANG_SUPPORT_NEEDED - enable the macro if bidi processing
** of strings has to be enabled for arabic language support.
** --------------------------------------------------------------------------*/
#define GFX_MGR02_DEFAULT_BACKGROUND_COLOR  0x00000000
#define GFX_MGR02_DEFAULT_CHAR              (0)
#define GFX_MGR02_ARABIC_LANG_SUPPORT_NEEDED 
#define GFX_MGR02_THAI_LANG_SUPPORT_NEEDED 
#define GFX_MGR02_HEBREW_LANG_SUPPORT_NEEDED 
#define GFX_MGR02_DEVANAGARI_LANG_SUPPORT_NEEDED 

/* ----------------------- DEBUG CONFIGURATIONS -------------------------------
** Enable debug print statements if needed. Currently gets enabled when _DEBUG
** is defined. Other thean this you can enable/disable prints from individual
** modules.
** GFX02_DEBUG_INFO                      - Enable to print dcu/2d-ace info prints
** GFX02_DEBUG_ERROR                     - Enable to print dcu/2d-ace error prints
** GFX02_DEBUG_CONTEXT                   - Enable to print context module prints
** GFX02_DEBUG_OVG                       - Enable to print OpenVG module prints
** GFX02_DEBUG_DAR                       - Enable to print dirty area module prints
** GFX_MGR02_DIRTY_REGION_REDRAW_DEBUG   - Enable to draw dirty area rectangles
**                                         on top of the framebuffer for debugging
** --------------------------------------------------------------------------*/
#ifdef _DEBUG
  #define gfx_debug(fmt, ...) printf(fmt, __VA_ARGS__)
  #define GFX_MGR02_DIRTY_REGION_REDRAW_DEBUG
#else
  #define gfx_debug(fmt, ...) 
#endif
