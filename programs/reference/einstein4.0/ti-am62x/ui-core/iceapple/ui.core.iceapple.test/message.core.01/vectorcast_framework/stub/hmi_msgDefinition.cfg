/*----------------------------------------------------------------------*/
/* Configure the IGN Freeze mode, if required to freeze all warnings,   */
/* which are not required to process, Otherwise do not define the macro */
/*----------------------------------------------------------------------*/
#define MSG_FREEZE_IGN_MODE         (MSG_IGNCRANK)

/*----------------------------------------------------------------------*/
/* Define this macro to enable NEW_MESSAGE_SEQ_QUEUE_TIMEOUT feature    */
/* in message core, otherwise the code sahll be execulded for           */
/* compilation to reduce the RAM, ROM size & execution time             */
/* Examble:                                                             */
/* #define HMI_MSG_ENABLE_NEW_MESSAGE_SEQ_QUEUE_TIMEOUT                 */
/* If defined the warning shall timeout from the sequencer queue when   */
/* the specified time is expired before coming to display               */
/*                                                                      */
/* Note: When the message is on top of Seq Q, then it will e considered */
/* as message is sent to display, and the message core won't check      */
/* whether the message screen got the focus or not.                     */
/*----------------------------------------------------------------------*/
#define HMI_MSG_ENABLE_NEW_MESSAGE_SEQ_QUEUE_TIMEOUT

/*---------------------------------------------------------------------*/
/* NAME: HMI_MSG_UNIQUE_DISP_IND_TIME                                  */
/* DESCRIPTION: Define this macro to have unique new warning display   */
/* time for every message. If the new warning display time is the same */
/* for all the messages then the this macro should not be defined. The */
/* common new warning display time can be configured using macro       */
/* HMI_MSG_DISP_IND_TIME. If the new warning display time is different */
/* then enable this macro and the new warning display time will be a   */
/* structure member(DispIndTimeout) of MSG_MESSAGE_STRUCT. The member  */
/* DispIndTimeout value will be directly passed to the timer interface */
/* So configuration need to be done accordingly.                       */
/*---------------------------------------------------------------------*/
#define HMI_MSG_UNIQUE_DISP_IND_TIME


/*---------------------------------------------------------------------*/
/* NAME: MSG_OLD_WRNG_REPETITION                                       */
/* DESCRIPTION: Usage of this macro•	When a warning is made old     */
/*              after first time show and if it is required to make    */
/*              the old warning new after a specific duration then     */
/*              this macro should be enabled.                          */
/*---------------------------------------------------------------------*/
 #define MSG_OLD_WRNG_REPETITION

/*---------------------------------------------------------------------*/
/* NAME: MSG_CYCLE_OPTION_WITH_TIMEOUT                                 */
/* DESCRIPTION: By Using this macro we can cycle the warnings till     */
/*              its timeout period(total display time)                 */
/*              For eg: 3 warnings A,B and C are present in the display*/
/*              and the total display time out of these warnings are   */
/*              configured as 10 seconds.							   */
/*              the warnings will be cycled in the following manner	   */
/*           A(4sec) -> B(4sec) -> C(4sec) ->A(4sec)-> B(4sec)->C(4sec)*/
/*           ->A(2sec) ->B(2sec) ->C(2sec).							   */
/*---------------------------------------------------------------------*/

#define MSG_CYCLE_OPTION_WITH_TIMEOUT

#if defined MSG_CYCLE_OPTION_WITH_TIMEOUT
    #define HMI_MSG_1SEC_TIME                    1000u
#endif
 
 
 /*--------------------------------------------------------------------*/
/* NAME: MSG_ACK_WRNG_REPETITION                                       */
/* DESCRIPTION: Usage of this macro•	When a warning is acknowledged */
/*              it is stored in store queue and if it is required      */
/*              bring the warning to display again by making it old    */
/*              after specific duration, this macro should be enabled. */
/*---------------------------------------------------------------------*/
 #define MSG_ACK_WRNG_REPETITION

 /*--------------------------------------------------------------------*/
/* NAME: MSG_ACK_WRNG_REPEAT_TIMER_CONTROL                             */
/* DESCRIPTION: Usage of this macro•	When the ack warning repeat    */
/*              timer needs to be controlled by the application then   */
/*              this configuration need to be enabled.  Application    */
/*              can start or pause or restart the timer.               */
/*---------------------------------------------------------------------*/
 #ifdef MSG_ACK_WRNG_REPETITION
 #define MSG_ACK_WRNG_REPEAT_TIMER_CONTROL
 #endif

 
/* When a msg from a category need to be shown alternately in display then   */ 
/* configure the value of ALTERNATELY_SHOW_MSG_FRM_CATEGORY_ENABLED as TRUE. */
/* If this feature is not required then configure as FALSE.                  */
#define ALTERNATELY_SHOW_MSG_FRM_CATEGORY_ENABLED      TRUE

/* When ALTERNATELY_SHOW_MSG_FRM_CATEGORY_ENABLED is TRUE then the category  */ 
/* from which the message need to be shown alternately should be configured. */
/* configure the category in CATEGORY_TO_BE_SHOWN_ALTERNATELY.  If value     */
/* of ALTERNATELY_SHOW_MSG_FRM_CATEGORY_ENABLED is FALSE then configure      */
/* CATEGORY_TO_BE_SHOWN_ALTERNATELY as mcMaximum.  There should not be more  */
/* than one message in the category configured.  Only one message in the     */
/* category configured will be shown alternately.                            */
#define CATEGORY_TO_BE_SHOWN_ALTERNATELY            mcOpFeedback

#define CATEGORYMASK_TO_BE_SHOWN_ALTERNATELY     1<<CATEGORY_TO_BE_SHOWN_ALTERNATELY
