/*---------------------------------------------------------------------*/
/* NAME: MSG_CYCLE_OPTION_ALL_CATEGORY                                 */
/* DESCRIPTION:  This macro Needs to be defined If warnings need to be */
/*               cycled irrespective of category.                      */
/*               If we define this macro, all warnings currently active*/
/*               in the que will cycle irrespective of the category.   */  
/*               For eg:If we have some requirement like, whenever     */
/*               multiple warnings are triggered,then the              */ 
/*               cluster shall cycle the warnings irrespective         */
/*               of  the category(Hard, soft, info etc).               */
/*               We have to define this Macro to support the above 	   */
/*               requirement                                           */
/*---------------------------------------------------------------------*/
//#define MSG_CYCLE_OPTION_ALL_CATEGORY

/*---------------------------------------------------------------------*/
/* NAME: MSG_CYCLE_OPTION_WITH_TIMEOUT                                 */
/* DESCRIPTION: By Using this macro we can cycle the warnings till     */
/*              its timeout period(total display time)                 */
/*              For eg: 3 warnings A,B and C are present in the display*/
/*              and the total display time out of these warnings are   */
/*              configured as 10 seconds.							   */
/*              the warnings will be cycled in the following manner	   */
/*           A(4sec) -> B(4sec) -> C(4sec) ->A(4sec)-> B(4sec)->C(4sec)*/
/*           ->A(2sec) ->B(2sec) ->C(2sec).							   */
/*---------------------------------------------------------------------*/
//#define MSG_CYCLE_OPTION_WITH_TIMEOUT

/*---------------------------------------------------------------------*/
/* NAME: DISP_TOUT_NO_TOUT_MSG_BY_PRIORITY                             */
/* DESCRIPTION: Usage of this macro•	When a category has both time  */
/*              out and no timeout messages and when it is required to */
/*              cycle all the messages in the category such that       */
/*              allowing the timeout messages to timeout completely and*/
/*              cycle option enabled messages to cycle for the cycle   */
/*              time.                                                  */
/*---------------------------------------------------------------------*/
//#define DISP_TOUT_NO_TOUT_MSG_BY_PRIORITY

/*---------------------------------------------------------------------*/
/* NAME: ALLOW_CURRENT_DURING_DISP_INDICATION_TIME                     */
/* DESCRIPTION: Usage of this macro•	                               */
/*              Every new message in a category will be displayed      */
/*              for the minimum display time.   Even if a new message  */
/*              gets triggered the current new message will be         */
/*              displayed for minimum display time followed by the     */
/*              new message.  The last new message in the queue will   */
/*              be continued for its full time out period.             */
/*---------------------------------------------------------------------*/
//#define ALLOW_CURRENT_DURING_DISP_INDICATION_TIME
/*---------------------------------------------------------------------*/
/* NAME: ALLOW_LOW_PRIORITY_UNDISPLAYED_MSG_IMMEDIATELY                               */
/* DESCRIPTION: Usage of this macro•	                                 */
/*              When this configuration is enabled then for messages   */
/*              with option DISP_INDICATION_TIME enabled interrupt will*/
/*              not happen within the category.i.e even if there are   */
/*              new messages yet to be displayed in the category only  */
/*              the highest priority message will be displayed. Within */
/*              category low priority new messages will not be shown.  */
/*---------------------------------------------------------------------*/
/* NOTE: When this configuration is enabled, then first time display
will be tracked for all the warnings. When a high priority is on the 
display and if any low priority undisplayed warning gets activated then
it will be shown for the minimum amount of time configured in display
indication timer.  Scanning will be done from low priority category to
the high priority category. Eg: Simulataneously if warnings from category
1,2,3 and 4 is active considering 4 as low priority category.  Category 4 
warning will be displayed first, once displayed the displayedOnce flag will
be set so in the next cycle category 3 warning will be displayed.  In next
cycle category 2 warning followed by category 1 warning.  The category 1
warning will hold the display since its the highest priority warning
*/

// #define ALLOW_LOW_PRIORITY_UNDISPLAYED_MSG_IMMEDIATELY

/*---------------------------------------------------------------------*/
/* NAME: MSG_RETAIN_NEW_MSG_DURING_HOLD                                */
/* DESCRIPTION: Usage of this macro•	                               */
/*              When hold time out is configured for a given message   */
/*              and if message is removed and message Id is retained   */
/*              on display as Hold Message ID, then the new message    */
/*              will be in cleared state. For MMC program the message  */
/*              was on the display as recycled message.  This feature  */
/*              will retain the new message flag when message on hold. */
/*---------------------------------------------------------------------*/
//#define MSG_RETAIN_NEW_MSG_DURING_HOLD

/*---------------------------------------------------------------------*/
/* NAME: MSG_REMOVE_HOLD_MSG_IN_NA_IGN_MODE                            */
/* DESCRIPTION: Usage of this macro•	                               */
/*              When hold time out is configured for a given message   */
/*              and if message is removed and message Id is retained   */
/*              on display as Hold Message ID,then even during ignition*/
/*              transition the message will not be removed from display*/
/*              even if the msg is not applicable for that ignition    */
/*              mode.The msg will be removed only after hold timeout.  */
/*              Few programs like Mazda, MMC wanted to remove the msg  */
/*              from display at once in not applicable ignition mode.  */
/*              This macro can be defined in order to achieve this.    */
/*---------------------------------------------------------------------*/
//#define MSG_REMOVE_HOLD_MSG_IN_NA_IGN_MODE

 
/*--------------------------------------------------------------------*/
/* NAME: ALTERNATELY_SHOW_MSG_FRM_CATEGORY                             */
/* DESCRIPTION: Usage of this macro•	When a msg from a category     */
/*              need to be shown alternately in display then define    */
/*              the macro of ALTERNATELY_SHOW_MSG_FRM_CATEGORY. If     */
/*              this feature is not required then need not define it.  */
/*---------------------------------------------------------------------*/
//#define ALTERNATELY_SHOW_MSG_FRM_CATEGORY 

/* When ALTERNATELY_SHOW_MSG_FRM_CATEGORY is defined then the category                   */ 
/* from which the message need to be shown alternately should be configured.             */
/* configure the category in CATEGORY_TO_BE_SHOWN_ALTERNATELY. There should not be more  */
/* than one message in the category configured.  Only one message in the                 */
/* category configured will be shown alternately.                                        */

#ifdef ALTERNATELY_SHOW_MSG_FRM_CATEGORY
#define CATEGORY_TO_BE_SHOWN_ALTERNATELY            mcWsInterrupt 
#endif
/*---------------------------------------------------------------------------------*/
/* NAME: CYCLE_IN_ORDER_WITHIN_CATEGORY                                            */
/* DESCRIPTION: Usage of this macro•	                                           */
/*              During cycling of messages within a category, when a               */
/*              message gets acknowledged or deactivated,message from top of the   */
/*              queue gets displayed. Enabling this macro, the next                */
/*              message in queue, if any, needs to be displayed.                   */
/*              If no messages are in queue, the top of the message                */
/*              reaches the display.                                               */
/*              For example, If w1,w2,w3,w4 are the warnings being cycled.         */
/*              If w2 gets deactivated or acknowledged while being displayed, then */
/*              cycling will continue from w3 if this option is enabled.           */
/*              If option is not enabled, cycling will restart from W1.            */ 
/*-------------------------------------------------------------------------------- */
//#define CYCLE_IN_ORDER_WITHIN_CATEGORY
