#define OVERRIDE_WARNING_OPTIONS     (MSG_OPTION_SEQUENCE |MSG_OPTION_CLEARABLE |MSG_OPTION_STORE |MSG_OPTION_CYCLE|MSG_OPTION_DISP_INDICATIONTIME | MSG_OPTION_OVERRIDE_HIGH)
#define ISSUE_WARNING_OPTIONS     (MSG_OPTION_SEQUENCE |MSG_OPTION_CLEARABLE)


