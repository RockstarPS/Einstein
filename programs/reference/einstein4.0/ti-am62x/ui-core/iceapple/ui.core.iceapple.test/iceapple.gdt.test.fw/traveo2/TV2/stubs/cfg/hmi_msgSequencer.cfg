    #define SEQ_ACK_AFT_MIN_TIMER_ID        hmi_msg_sequence_ack_KSWTIMWE
    #ifdef MSG_OLD_WRNG_REPETITION
        #define SEQ_OLD_WRNG_REP_1SEC_TIMER_ID    hmi_msg_sequence_oldwrng_1sec_KSWTIMER
	#endif
    #ifdef HMI_MSG_ENABLE_NEW_MESSAGE_SEQ_QUEUE_TIMEOUT
        #define SEQ_MSGQTIMEOUT_1SEC_TIMER_ID   hmi_msg_sequence_msgq_1sec_KSWTIMER
    #endif
    #ifdef MSG_CYCLE_OPTION_WITH_TIMEOUT
        #define SEQ_1SEC_TIMER_ID        hmi_msg_sequence_1sec_KSWTIMWE
    #endif

#define MSG_START_SW_TIMER(timeout, timer)   hmi_wrn_ctrl_start_timer(timer, timeout)
