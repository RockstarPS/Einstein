/*          OPTION_VIEWER_NONE  : No special actions                    */
/*          OPTION_VIEWER_WRAP  : Wrap top to bottom and bottom to top  */
/*----------------------------------------------------------------------*/
#define MSG_SEQUENCER_VIEWER_OPTIONS    (OPTION_VIEWER_WRAP)


