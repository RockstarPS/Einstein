/*
** Sample configuration for codewarrior
** #define GFX_<font name>_DATA_PREFIX __declspec(section "<section name>")
** typedef UINT8 GFX_<font name>_DATA_T;
**
** For the Helv47ltcn_20 font create the following to place it in QSPI0_FLASH
** #pragma section "QSPI0_FLASH" "QSPI0_FLASH"
** #define GFX_HELV47LTCN_20_DATA_PREFIX  __declspec(section "QSPI0_FLASH")
** typedef UINT8 GFX_HELV47LTCN_20_DATA_T;
** If a particular font needs to be in the internal ROM then do not define the
** GFX_<font name>_DATA_PREFIX and GFX_<font name>_DATA_T for that font.
*/
#define GFX_DEFAULT_FONT_DATA_PREFIX
typedef UINT8 GFX_DEFAULT_FONT_DATA_T;

