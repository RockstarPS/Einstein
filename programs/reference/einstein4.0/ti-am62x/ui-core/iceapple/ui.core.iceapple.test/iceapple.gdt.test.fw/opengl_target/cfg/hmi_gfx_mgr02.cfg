/* ------------------ DCU Build next screen content if it crosses vblank duration -------
** Target: Spectrum - MPC5645S_LITE 
** Enable this macro when the build time crosses the vertical blanking time and causes 
** a conflict in QSPI access. When an update cannot be finished with in vertical blanking
**   (a)the core software change is to defer the building process, once it reached the 
**      interval end of the blanking period
**   (b)and then continue the build in next blanking interval
**
**  Possible effects:-
**  1.	Display update will be delayed and effect on animations
**      a.	Effect is only that fps drops from 25 to 17 for a single frame when there is high load
**  2.	Possibility to endless deferring and causing non update of displays
**      a.	Will be handled with only one differing per update cycle
** --------------------------------------------------------------------------------------*/
#ifdef GFX_MGR02_SYNCHRONISE_DMA_BUILD_WITH_VBLANK
 /*#define GFX_MGR02_BUILD_EXCEED_THAN_VBLANK_HANDLING */

 #ifdef GFX_MGR02_BUILD_EXCEED_THAN_VBLANK_HANDLING

	/* ------------------ vblank period/interval calculation   ------------------------------  
	**   #ifdef GFX_MGR02_USE_SHARP_LQ042
	**     #define CLOCK_SPREAD                 (2)
	**     #define DCU_CLOCK                    (GFX_FLOAT)(64000000 - ((64000000*CLOCK_SPREAD)/100))
	**     #define DELTA_X                      (480/16)
	**     #define DELTA_Y                      (272)
	**     #define J4                           ((DCU_CLOCK/(SHARP_LQ042_DIV_RATIO+1))/1000000)
	**     #define J5                           (SHARP_LQ042_PULSE_WIDTH_HORIZONTAL+SHARP_LQ042_BACK_PORCH_HORIZONTAL+(DELTA_X * 16) + SHARP_LQ042_FRONT_PORCH_HORIZONTAL)
	**     #define J6                           (J5 * (1/J4))
	**     #define J7                           ((SHARP_LQ042_FRONT_PORCH_VERTICAL+SHARP_LQ042_PULSE_WIDTH_VERTICAL+SHARP_LQ042_BACK_PORCH_VERTICAL)-1)
	**     #define GFX_MGR02_VBLANK_PERIOD_USEC (J7 * J6)
	**   #endif
	**  -- Define the vblank period by calculating as above given ex: 2.13ms --
	** -------------------------------------------------------------------------------------*/
   #define  GFX_MGR02_VBLANK_PERIOD_USEC  (2139)
   /* Number of vblank cycles required to complete build, if build not finishes 
   **   within in a 1 vblank cycle. Max cycles will be ~4 if vblank duration (>~1000 and < ~1200)
   */   
   #define  GFX_MGR02_BUILD_VBLANK_DIFFER_COUNT  (1)
 #endif
#endif

