/* ---------------- TOUCH SCREEN CONFIGURATIONS -------------------------------
** Touch screens specific configurations. Required only if touch screen 
** support is enabled by the GDT design (i.e. any widget is configured as
** touch enabled). This is how the touch support works,
** Touch driver notifes the touch events to graphics manager by calling
** hmi_gfx_mgr02_layout_push_touch_event() function. For a windows 
** simulation build this function is calles by the graphics manager 
** simulation window component itself on every mouse event. But when 
** putting the code in to a target device, its applications resposibility
** to call this function to pass events to graphics manager. When an object
** is detected by graphics manager as touched, graphics manager
** calls hmi_gfx_mgr02_app_touch_event_handler() function with objects ID and
** touch co-ordinates, touch event information. This function needs to be
** implemented by the application so that events can be received.
**
** 1. GFX_MGR02_TOUCH_NO_OF_FINGERS -
**    Specify the number to touches need to be supported at the same moment.
**    
** 2. GFX_MGR02_TOUCH_EVENT_Q_SIZE - 
**    Specify the size of the touch event queue. When touch driver notifies
**    touch events to graphics manager, it gets stored inside a queue for 
**    later process by graphics manager on next call to function
**    hmi_gfx_mgr02_layout_build_screen. 
** 3. GFX_MGR02_CREATE_CS, GFX_MGR02_INIT_CS, GFX_MGR02_ENTER_CS, GFX_MGR02_LEAVE_CS
**    and GFX_MGR02_DELETE_CS
**    Since the touch events are put in to a queue and later processed by a different 
**    task, there is a possibility that the caller of the hmi_gfx_mgr02_layout_push_touch_event()
**    and process function hmi_gfx_mgr02_layout_build_screen() might be running in a 
**    two different priority tasks which can get pre-empted. In such case above definitions
**    aloow the creation of a semaphore, mutex etc to provide a locking mechanism to 
**    the touch event queue. Below sample implementation shows creation of a critical
**    section for windows. Similar implementation could be followed for other RTOS
** 4. GFX_MGR02_ENABLE_TOUCH_OBJ_SIZE_CALC - 
**    In some cases rather than animating the touch widget, the objects within
**	  the touch widgets might be animated by an application to position the touch area.
**    Inorder to account this animated touch area & position, the bound of the widget
**    needed to be calculated at run time to determine its position & size.
**    Define this macro to enable the support when required. Please note that, due to
**    dynamic calculation of bound, the touch area will be limited to the bound of the
**    widget. So inorder to control the area, a dummy object like a transparent 
**    fill screen can be placed inside the touch widget.
** --------------------------------------------------------------------------*/
/*#define GFX_MGR02_ENABLE_TOUCH_OBJ_SIZE_CALC*/
#define GFX_MGR02_TOUCH_NO_OF_FINGERS (1)
#define GFX_MGR02_TOUCH_EVENT_Q_SIZE  (10)
#ifdef WIN32
  #define GFX_MGR02_CREATE_CS(x)          \
  CRITICAL_SECTION x
  #define GFX_MGR02_INIT_CS(x)        InitializeCriticalSection(&(x))
  #define GFX_MGR02_DELETE_CS(x)          (DeleteCriticalSection(&(x))
  #define GFX_MGR02_ENTER_CS(x)       EnterCriticalSection(&(x))
  #define GFX_MGR02_LEAVE_CS(x)       LeaveCriticalSection(&(x))
#elif defined(LINUX)
  #define GFX_MGR02_CREATE_CS(x)          \
  pthread_mutex_t x = PTHREAD_MUTEX_INITIALIZER;
  #define GFX_MGR02_INIT_CS(x)   ((x) = PTHREAD_MUTEX_INITIALIZER)
  #define GFX_MGR02_DELETE_CS(x) pthread_mutex_destroy(&(x))
  #define GFX_MGR02_ENTER_CS(x)  pthread_mutex_lock(&(x))
  #define GFX_MGR02_LEAVE_CS(x)  pthread_mutex_unlock(&(x))
#else
  /*
  ** TODO do it with pthread if pthread exists on mqx
  */
  #define GFX_MGR02_CREATE_CS(x)
  #define GFX_MGR02_INIT_CS(x)
  #define GFX_MGR02_DELETE_CS(x)
  #define GFX_MGR02_ENTER_CS(x)
  #define GFX_MGR02_LEAVE_CS(x)
#endif

