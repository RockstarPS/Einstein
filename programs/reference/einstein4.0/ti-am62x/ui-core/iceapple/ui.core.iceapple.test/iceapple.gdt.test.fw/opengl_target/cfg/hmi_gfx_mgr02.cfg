**   Specifies the base address for the GRAM how much GRAM is available for the
**   dcu target to perform widget and text element building. Below sample 
**   configuration are provided for spectrun/rainbow-lite/rainbow assuming full
**   gram is available. This could be changed accordingly by the app need
**   Note : GFX_MGR02_GRAM_BASE should not be set for a WIN32 or
