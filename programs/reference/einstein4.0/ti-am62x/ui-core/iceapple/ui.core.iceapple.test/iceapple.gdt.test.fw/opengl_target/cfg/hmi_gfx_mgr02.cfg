/* ----------------------- DIRTY AREA REDRAW CONFIGURATIONS -------------------
** OpenVG and Software rendering can additional capability to determine
** dirty areas which require updates and update only those dirty regions
** rather than building the whole content again to reduce build time
** This is not available for DCU.
** GFX_MGR02_DIRTY_REGION_REDRAW - defining this will enable dirty area
**                                 redraw. Uses additional RAM to store the 
**                                 elements previous status and next status etc
**                                 for calculations
** GFX_MGR02_DAR_RECT_PROXIMITY  - proximity value for rectangles if a rectangle
**                                 comes closer with in this proximity value, they 
**                                 get comined as a single dirty rectangle.
**                                 This option is to reduce the number of dirty
**                                 rectangles. valid ranges are from 0 to XX
**                                 value of 0 means no proximity for dirty
**                                 rectanges and multiple dirty rectangles gets
**                                 combined only if they actually overlap
** GFX_MGR02_DAR_MAX_RECTANGLES  - Threshold value to stop the dirty area 
**                                 redraw and do a full update instead. Because
**                                 dirty area update on a large number of 
**                                 rectangles may be slower than doing a full 
**                                 update. Valid values are from 0 - XX
**                                 Value 0 means option is disabled and dirty
**                                 area update is performed regardless of number
**                                 dirty rectangles.
** --------------------------------------------------------------------------*/
#define GFX_MGR02_DIRTY_REGION_REDRAW            
#define GFX_MGR02_DAR_RECT_PROXIMITY   (5)
#define GFX_MGR02_DAR_MAX_RECTANGLES   (10)

/* ----------------------- COMMON CONFIGURATIONS ---------------------------
** GFX_MGR02_DEFAULT_BACKGROUND_COLOR - 
**    Define the 32-bit default background color.  Any area of the display that
**    does not have an active pixel will be set to this color, and it will be
**    blended with other layers if those layers have selected the alpha
**    blending option.  This is the value that will be set at cold/warm/wakeup
**    initialization.
**
**    The MS 8-bits are ignored, the next 8-bits are the R value, then the G
**    value, then the B value.
**
**    Some examples:
**      0x00000000 black
**      0x00FFFFFF white
**      0x00404040 mid-gray
**      0x00FF7FFF pink
**
**    The macro "GFX_MGR02_DEFAULT_BACKGROUND_COLOR" selects the background
**    color for the DCU. 
**    This will be used for clearing of the buffer in the case of SWR/OVG 
**    layers (Not yet implemented)
** GFX_MGR02_DEFAULT_CHAR - 
**    When the text rendering routine doesnot finds a character code in the
**    font data table, then it will print this default character instead of
**    missing character in the string. Configure it to '*' if you want to
**    replace '*' where ever a character is missing or to any code as you wish.
**    Incase you don't any replacement character functionality for missing 
**    character, then configure it to 0x00
** GFX_MGR02_ARABIC_LANG_SUPPORT_NEEDED - enable the macro if bidi processing
** of strings has to be enabled for arabic language support.
**
** GFX_MGR02_THAI_LANG_SUPPORT_NEEDED - enable the macro if thai language 
** support is needed. GSUB table in font is used for thai text rendering.
**
** GFX_MGR02_HEBREW_LANG_SUPPORT_NEEDED - Enable the macro if Hebrew language 
** support is needed.
**
** GFX_MGR02_DEVANAGARI_LANG_SUPPORT_NEEDED - Enable the macro if Hindi language 
** support is needed.
**
** GFX_MGR02_INLINE_INIT - 
**    When using OpenVG/GL the init sequence will take a considerable time to 
**    complete. So when using DI-Kernel it may affect the task execution time 
**    boundary.
**    So this macro provides an option to switch between
**    an inline initialization GFX_MGR02_INLINE_INIT (1) or 
**    a delayed initialization in pre-emptable graphics task GFX_MGR02_INLINE_INIT (0)
**    When using pre-emptive OS such as linux, this macro can be set to
**    GFX_MGR02_INLINE_INIT (1) always.
**    If this macro is not defined, its default behaviour is
**    1. For OpenVG/GL     - GFX_MGR02_INLINE_INIT (0) 
**    2. For other targets - GFX_MGR02_INLINE_INIT (1) 
** --------------------------------------------------------------------------*/
#define GFX_MGR02_DEFAULT_BACKGROUND_COLOR  0x00000000
#define GFX_MGR02_DEFAULT_CHAR              (0)
