/* ----------------------- I/F LAYER CONFIGURATIONS ---------------------------
** These defines are valid only of the application uses the I/F layer capability
** of the graphics manager. The I/F layer wraps the graphics manager APIs and 
** also implements a scheduling mechanism to run the applications presentation
** code. The presentation code is scheduled at a rate configured in the 
** GFX_MGR02_IF_APP_PRESENTATION_RATE provided the graphics manager's build task is
** not busy doing the building. This provides a locking mechanism where the
** application presentation tasks is scheduled first, then if there are any commands
** issued to graphics manager then the graphics manager build routines are invoked.
** The I/F layer blocks execution of presentation tasks until the manager finishes 
** the build operation. Graphics manager I/F layer will invoke this handler at the rate set for
** hmi_gfx_mgr02_if_KSTimedTask(). Application shall invoke the
** graphics manager API's in hmi_gfx_mgr02_if.h only with in the
** context of GFX_MGR02_IF_APP_PRESENTATION_TASK()
** GFX_MGR02_IF_APP_PRESENTATION_TASK() - configure a application presentation task
**   which will be scheduled by I/F layer periodically. For applications using
**   view manager component VM01 or VM02 this will need to set to the hmi_lsh_task()
**   function.
** GFX_MGR02_IF_APP_PRESENTATION_RATE   - The rate in mSec at which the presetation task
**   to bescheduled.
** GFX_MGR02_IF_TASK_RATE               - The rate at which the hmi_gfx_mgr02_if_KSTimedTask()
**   is scheduled by the application/RTOS. This needs to be <= GFX_MGR02_IF_APP_PRESENTATION_RATE
**   Lower values are more desirable as it reduces the error in scheduling of the presentation
**   task. Because it is at GFX_MGR02_IF_TASK_RATE rate that the I/F layer polls whether
**   an ongoing build is finished or not and then schedules the presentation if the
**   GFX_MGR02_IF_APP_PRESENTATION_RATE mSec has elapsed since its last call. So if
**   GFX_MGR02_IF_TASK_RATE is XmSec there is a chance that there will be XmSec delay
**   can happen in scheduling the next presentation task.
** I/F layer consists of the following files
** 1. hmi_gfx_mgr02_if.c 
** 2. hmi_gfx_mgr02_if_chart.c and 
** 3. hmi_gfx_mgr02_if_model_autocode.c
** These needs to be included in make script if the I/F layer capability is needed.
**
** But if the application decides to skip the I/F layer capabilities and directly
** interact with hmi_gfx_mgr02_layout.c then its the application responsibility to
** make sure that it doesnot invokes any API's while the graphics manager build 
** task is running. So these configurations are also not required in that case. 
** --------------------------------------------------------------------------*/
#define GFX_MGR02_IF_APP_PRESENTATION_TASK()  hmi_lsh_task()
#define GFX_MGR02_IF_APP_PRESENTATION_RATE    (16)
#define GFX_MGR02_IF_TASK_RATE                (4)


#define HMI_STRNLEN(x, y) HMI_STRLEN(x)

/* ----------------------- Font Engine Support ---------------------
** If the filesystem option in prohect settings is enabled and if the 
** UseExtFontEngine property for a font element is set to True then the font
** data structure for the font is generated to have just a path reference to 
** the ttf font file. Now it is possible to use an external font engine such 
** as FreeType to render the text. 
** GFX_MGR02_BMPFONT -  is default with internal bitmap font
** e.g. FreeType2 is integrated for the OpenGL library. In order to use 
** FreeType enable #define GFX_MGR02_EXT_FONT_ENGINE (GFX_MGR02_FREETYPE)
**
** GFX_MGR02_DEFAULT_CHAR - set a default character code to replace a missing
** character
**
** We can control the text appearance by inserting some command sequence in
** the string. format
**   unicode string => L"xyz.." + <cmd><data1><data2> + L"xyz.."
**   ascii string   =>  "xyz.." + <cmd><data1><data2><data3><data4> + "xyz.."
** Currently color change and space pixel insert commands are supported
** But both of these are implemented only for OpenGL target.
** 1.GFX_MGR02_TEXT_COLOR_CODE_PREFIX - prefix value to be used to insert a 
**   draw color command in string. 
**   E.g String = "Hello World" - now inorder to display Hello in default color
**   set in GDT and World in red color, we should follow this
**   String[0] = 'H';   String[1] = 'e'; String[2] = 'l'; String[3] = 'l';
**   String[4] = '0';   String[5] = ' ';
**   String[6] = GFX_MGR02_TEXT_COLOR_CODE_PREFIX;
**   Now for wide char configuratio, each char is 2byte length so we can fit
**   RGBA color as below
**    String[7] = 0xRRGG     = 0xFF00   (Red component is 255, Green is 0)
**    String[8] = 0xBBAA     = 0x00FF   (Blue is 0 and alpha is 255)
**   For ascii configuration
**    String[7] = 0xRR  = 0xFF
**    String[8] = 0xGG  = 0x00
**    String[9] = 0xBB  = 0x00
**    String[10] = 0xAA = 0xFF
**   Now rest of the String locations needs to be filled with "World"
** 2.GFX_MGR02_TEXT_SPACE_CODE_PREFIX - prefix value to specify the insertion of
**   number of blank pixels. When the graphics manager sees this command, the 
**   following char after the command is considered as number of pixels to
**   advance in X direction.
**   e.g. "xyz" + <cmd><data> + "xyz" 
**   where <cmd> = GFX_MGR02_TEXT_SPACE_CODE_PREFIX
**         <data> = number of space pixels  needed (max value is 255 for ascii and 65535 for unicode)
**        String[0] = 'x';   String[1] = 'y'; String[2] = 'z'; 
**        String[3] = GFX_MGR02_TEXT_SPACE_CODE_PREFIX;
**        String[4] = 10; // 10 spaces after xyz
**        String[6] = 'x';   String[7] = 'y'; String[8] = 'z'; 
**        String[9] = '\0';
** Note : make sure that the prefix values falls in to non printable char ranges
**        otherwise graphics manager will misinterpret regular character as a 
**        command.
** --------------------------------------------------------------------------*/
#define GFX_MGR02_EXT_FONT_ENGINE (GFX_MGR02_BMPFONT)
/* Default shape engine will be gfx mgr <GFX_MGR02_DEFAULT>	*/
#define GFX_MGR02_SHAPE_ENGINE  (GFX_MGR02_DEFAULT)
#if GFX_MGR02_EXT_FONT_ENGINE == (GFX_MGR02_MONOTYPE)
    /*#define GFX_MGR02_SHAPE_ENGINE  (GFX_MGR02_WORLDTYPE) */
#endif
#if (GFX_MGR02_EXT_FONT_ENGINE == GFX_MGR02_FREETYPE)||(GFX_MGR02_EXT_FONT_ENGINE == GFX_MGR02_SPANSION_FT2)
   /*#define GFX_MGR02_SHAPE_ENGINE  (GFX_MGR02_HARFBUZZ) */
#endif
#if (GFX_MGR02_SHAPE_ENGINE == GFX_MGR02_WORLDTYPE) || (GFX_MGR02_SHAPE_ENGINE == GFX_MGR02_HARFBUZZ)
 #ifndef GFX_MGR02_ARABIC_LANG_SUPPORT_NEEDED
   /* Need this while allocating buffer allocations for text process */
   #define GFX_MGR02_ARABIC_LANG_SUPPORT_NEEDED
 #endif
 #ifndef GFX_MGR02_HEBREW_LANG_SUPPORT_NEEDED
