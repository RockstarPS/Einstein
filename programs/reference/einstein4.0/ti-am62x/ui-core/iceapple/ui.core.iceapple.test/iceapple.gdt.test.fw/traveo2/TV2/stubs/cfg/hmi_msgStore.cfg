/*----------------------------------------------------------------------*/
/* MACRO: Configure to arrange the store queue in first in first        */
/*        out manner.                                                   */
/*----------------------------------------------------------------------*/
#define STORE_QUEUE_FIFO

/*----------------------------------------------------------------------*/
/* MACRO: Configure to view the currently pointed msg even if queue is  */
/*        added with new messages or deleted with few messages.         */
/*----------------------------------------------------------------------*/
