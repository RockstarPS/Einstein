/*--------------------------------------*/

#define MSG_STORE_VIEWER_OPTIONS    (OPTION_VIEWER_WRAP)


#ifdef MSG_ACK_WRNG_REPETITION
/*----------------------------------------------------------------------*/
/* MACRO:       Resolution of ack warning repeat timeout timer          */
/*----------------------------------------------------------------------*/
/* Mention the resolution of the timer in multiples of 100 millisecond  */
#define HMI_MSG_ACK_REP_TIMER_RESLN_IN_MILLSEC   (100)
#define HMI_MSG_ACK_REP_TIMER_RESLN_FACTOR     (HMI_MSG_SEC_TO_MILLISEC/HMI_MSG_ACK_REP_TIMER_RESLN_IN_MILLSEC)

/*----------------------------------------------------------------------*/
/* MACRO:       Value to be loaded to start seq MsgQueue timeout timer  */
/*----------------------------------------------------------------------*/
/* Accepted range of timer value to be loaded is 100ms to 1000ms(1sec)  */
/* If the timer resolution is 100ms then maximum new message queue      */
/* timeout value supported for a message is 25s.(UINT8 so 25*10 = 250)  */
/* If the timer resolution is 1000ms then maximum new message queue     */
/* timeout value supported for a message is 255s.(UINT8 so 255*1 = 255) */
#define HMI_MSG_ACK_REP_TIMER_VAL     (TO_MILLISEC(HMI_MSG_ACK_REP_TIMER_RESLN_IN_MILLSEC))

/*----------------------------------------------------------------------*/
/* If we are not using private timers, then define the name of the      */
/* kernel timer to be used for this module                              */
/*----------------------------------------------------------------------*/
#ifndef ENABLE_PRIVATE_TIMERS
#define STOR_ACK_WRNG_REP_TIMER_ID   hmi_msg_sequence_Ackwrng_1sec_KSWTIMER
#endif 
/*----------------------------------------------------------------------*/
/* MACRO: Ack warning repetition duration in seconds.                   */
/*----------------------------------------------------------------------*/
#define HMI_MSG_ACK_WRNG_REP_DURATION     (6)

#endif


/*----------------------------------------------------------------------*/
/* MACRO: Request client to add a message.                              */
