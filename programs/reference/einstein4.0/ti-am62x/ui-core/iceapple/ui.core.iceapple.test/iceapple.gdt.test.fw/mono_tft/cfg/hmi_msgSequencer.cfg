extern void hmi_warning_show_notification(MSG_VIEWINFO_T * alertInfo);
extern void hmi_warning_hide_notification(eMessageIdentity MessageID);

/*----------------------------------------------------------------------*/
/* MACRO: Request display client to show message.                       */
/*          msgInfo: pointer to MSG_VIEWINFO_T (always reference this   */
/*                   parameter to prevent a QAC warning)                */
/*  NOTE: If you only want the message ID then use (msgInfo)->Id        */
/*----------------------------------------------------------------------*/
#define MSG_DISPLAY_SHOW(msgInfo)  hmi_warning_show_notification(msgInfo)
    

/*----------------------------------------------------------------------*/
/* MACRO: Request display client to hide message.                       */
/*----------------------------------------------------------------------*/
#define MSG_DISPLAY_HIDE(msg)  hmi_warning_hide_notification(msg)

/*----------------------------------------------------------------------*/
/* MACRO: Request client to add a message.                              */
/*----------------------------------------------------------------------*/
#define MSG_SEQUENCER_CLIENT_ADD(msg)       msg_StoreAdd(msg)

/*----------------------------------------------------------------------*/
/* MACRO: Request client to remove a message.                           */
/*----------------------------------------------------------------------*/
#define MSG_SEQUENCER_CLIENT_REMOVE(msg)    (void)msg_StoreRemove(msg)

/*----------------------------------------------------------------------*/
/* MACRO: Notify viewer that a message has changed.                     */
/*----------------------------------------------------------------------*/
#define MSG_SEQUENCER_NOTIFY_VIEWER()       

/*----------------------------------------------------------------------*/
/* If we are not using private timers, then define the name of the      */
/* kernel timer to be used for this module                              */
