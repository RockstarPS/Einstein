#define SOFT_WARNING_TIMEOUT    ( MS(1020) )
#define INFORMATION_TIMEOUT     ( MS(1030) )
#define OK_CONDITION_TIMEOUT    ( MS(1040) )
#define OP_FEEDBACK_TIMEOUT     ( MS(1050) )

#define HARD_WARNING_OPTIONS    (MSG_OPTION_SEQUENCE |MSG_OPTION_CLEARABLE |MSG_OPTION_STORE )
#define SOFT_WARNING_OPTIONS    (MSG_OPTION_SEQUENCE |MSG_OPTION_CLEARABLE |MSG_OPTION_STORE )
#define INFORMATION_OPTIONS     (MSG_OPTION_SEQUENCE |MSG_OPTION_CLEARABLE |MSG_OPTION_STORE )
#define OK_CONDITION_OPTIONS    (0                   |0                    |MSG_OPTION_STORE )
#define OP_FEEDBACK_OPTIONS     (MSG_OPTION_SEQUENCE |MSG_OPTION_CLEARABLE |0                )


#define _ALL_                   (0xFF)


#define VOID_PTR(x) ((void * const)(&x))

#if defined SIF_SUPPORT_EXTENDED_QUALIFIER
  #define TEST_QUALIFIER    (NULL)
  #define CALLBACK_MASK     (NULL)
