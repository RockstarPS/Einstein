  #define CALLBACK_MASK     (0xFF)
#endif

#define MSG_TEST_OF_WARN_1  \
{ \
    test_GetWarningState, \
    test_EventCallback, \
    TEST_QUALIFIER, \
    CALLBACK_MASK, \
    3, \
	4, \
    mcOpFeedback, \
    1, \
    OP_FEEDBACK_OPTIONS, \
    MSG_IGNRUN|MSG_IGNCRANK, \
	5, \
    mgAckGroupA \
}


/*--------------------------------------------------------------------------*/
/* Define the set of messages for this application.                         */
