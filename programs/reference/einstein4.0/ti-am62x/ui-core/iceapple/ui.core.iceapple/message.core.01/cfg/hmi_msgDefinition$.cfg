#define MSG_MESSAGE_LIST  MSG_TEST_OF_WARN_1

#define MSG_START_SW_TIMER(timeout, timer)  hmi_check_hold_timer_and_start(timeout, timer)
#define MSG_CLEAR_SW_TIMER(timer)           hmi_timer_support_clear_timer(timer)
#define MSG_CHECK_SW_TIMER(timer)           hmi_timer_support_check_timer(timer)

