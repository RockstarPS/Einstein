; DLT Gateway configuration

[DltGatewayConfiguration]
ServerIpAddress      = 127.0.0.1
ReconnectIntervalMS  = 2000
; -1 = retry indefinitely
ReconnectMaxRetries  = -1
StartupAckIntervalMS = 500
; Keep 1: VIP cannot tell a repeated startup ACK from a buffer ACK
StartupAckMaxRetries = 1
TransportType        = SharedMemory
NumberOfCores        = 3
Core_0               = Core0
Core_1               = Core1
Core_2               = Core2

[Core0]
Name            = VIP
ServerPort      = 5000
ShmStartAddress = 0x82385000
ShmSize         = 8192
NumberOfBuffers = 3
Buffer_0        = Core0Buffer0
Buffer_1        = Core0Buffer1
Buffer_2        = Core0Buffer2

[Core1]
Name            = HSM
ServerPort      = 5001
ShmStartAddress = 0x82387000
ShmSize         = 4096
NumberOfBuffers = 2
Buffer_0        = Core1Buffer0
Buffer_1        = Core1Buffer1

[Core2]
Name            = DM
ServerPort      = 5002
ShmStartAddress = 0x82388000
ShmSize         = 4096
NumberOfBuffers = 2
Buffer_0        = Core2Buffer0
Buffer_1        = Core2Buffer1

; Position = bit in DLTMessageReadRequest status[0]

[Core0Buffer0]
BufferStartAddress = 0x82385000
BufferSize         = 2048
Position           = 0

[Core0Buffer1]
BufferStartAddress = 0x82385800
BufferSize         = 2048
Position           = 1

[Core0Buffer2]
BufferStartAddress = 0x82386000
BufferSize         = 4096
Position           = 2

[Core1Buffer0]
BufferStartAddress = 0x82387000
BufferSize         = 2048
Position           = 3

[Core1Buffer1]
BufferStartAddress = 0x82387800
BufferSize         = 2048
Position           = 4

[Core2Buffer0]
BufferStartAddress = 0x82388000
BufferSize         = 2048
Position           = 5

[Core2Buffer1]
BufferStartAddress = 0x82388800
BufferSize         = 2048
Position           = 6
