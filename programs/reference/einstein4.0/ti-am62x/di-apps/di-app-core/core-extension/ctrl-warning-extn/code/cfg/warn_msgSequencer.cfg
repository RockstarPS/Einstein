#ifdef WARN_MSG_ENABLE_NEW_MESSAGE_SEQ_QUEUE_TIMEOUT
/*----------------------------------------------------------------------*/
/* MACRO:       Resolution of seq MsgQueue timeout timer                */
/*----------------------------------------------------------------------*/
/* Mention the resolution of the timer in millisecond                   */
#define HMI_MSG_Q_TIMER_RESLN_IN_MILLSEC   (100u)
#define HMI_MSG_SEQ_TIMER_RESLN_FACTOR     (HMI_MSG_SEC_TO_MILLISEC/HMI_MSG_Q_TIMER_RESLN_IN_MILLSEC)

/*----------------------------------------------------------------------*/
/* MACRO:       Value to be loaded to start seq MsgQueue timeout timer  */
/*----------------------------------------------------------------------*/
/* Accepted range of timer value to be loaded is 100ms to 1000ms(1sec)  */
/* If the timer resolution is 100ms then maximum new message queue      */
/* timeout value supported for a message is  25secs.                    */
/* If the timer resolution is 1000ms then maximum new message queue     */
/* timeout value supported for a message is  255secs.                   */
#define HMI_MSG_Q_TIMER_VAL     (HTS_TO_MILLISECONDS(HMI_MSG_Q_TIMER_RESLN_IN_MILLSEC))
#endif /* WARN_MSG_ENABLE_NEW_MESSAGE_SEQ_QUEUE_TIMEOUT */

