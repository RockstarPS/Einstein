[SystemStateConfiguration]
; ///@Domain ID, which is send by System state to :ScPwMgr for extend the shutdown time
DomainId=15
; ///@Periodicity of the broadcast message
PowerStateMessagePeriodicityMs=2000
; ///@Full Run Component Transition List
FullRunComponentTransitionList=10,20
; ///@Shutdown state to Final state transition timeout
ShutdownFinalTimeoutMs=5000

[States]
0=ESystemState_Off
1=ESystemState_Startup
2=ESystemState_Up
3=ESystemState_FullRun
4=ESystemState_PrepareShutdown
5=ESystemState_Minimal
6=ESystemState_Meet
7=ESystemState_FullRun_Flash
8=ESystemState_FullRun_ECALL
9=ESystemState_LowPower
10=ESystemState_Minimal_AccOff
11=ESystemState_FullRun_UserOff
12=ESystemState_Minimal_OneHour
13=ESystemState_Emergency_Shutdown
14=ESystemState_Shutdown
15=ESystemState_Last
